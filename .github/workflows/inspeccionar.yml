name: Inspeccionar fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" "https://rfevb-web.dataproject.com/CompetitionMatches.aspx?ID=167&PID=203" -o rfevb-partidos.html || true
          curl -sSL -A "$UA" "https://rfevb-web.dataproject.com/CompetitionStandings.aspx?ID=167&PID=203" -o rfevb-clasif.html || true
          curl -sSL -A "$UA" "https://fedexvoleibol.com/calendario-senior-femenino-2" -o fedex-calendario.html || true
          curl -sSL -A "$UA" "https://fedexvoleibol.com/clasificacion-senior-femenino" -o fedex-clasif.html || true
          git init -q -b inspeccion && git add . && git -c user.name=bot -c user.email=bot@example.com commit -qm dump
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" inspeccion
